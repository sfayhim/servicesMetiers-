services:
  # Service Web (Backend Spring Boot)
  - type: web
    name: pharmacie-backend
    env: java
    region: frankfurt # ou 'oregon' selon votre préférence
    plan: free
    buildCommand: mvn clean package -DskipTests
    startCommand: java -Dserver.port=$PORT -jar target/*.jar
    healthCheckPath: /actuator/health
    envVars:
      - key: JAVA_OPTS
        value: -Xmx512m -Xms256m
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pharmacie-db
          property: connectionString
      - key: SENDGRID_API_KEY
        sync: false # À configurer manuellement dans Render
      - key: SENDGRID_FROM_EMAIL
        sync: false # À configurer manuellement dans Render
      - key: SENDGRID_FROM_NAME
        value: Pharmacie

databases:
  # Base de données PostgreSQL
  - name: pharmacie-db
    databaseName: pharmacie
    plan: free
    region: frankfurt # même région que le service web
