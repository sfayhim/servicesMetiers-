# Profil pour creer et initialiser la base de donnees PostgreSQL
# Ce profil cree le schema a partir des annotations JPA et charge les donnees initiales depuis data.sql

# Pour demarrer avec ce profil localement :
# mvn spring-boot:run -Dspring-boot.run.profiles=create

# Pour generer du SQL optimise pour PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# L'URL de la source de donnees PostgreSQL
# Render fournit automatiquement JDBC_DATABASE_URL avec le bon format jdbc:postgresql://...
spring.datasource.url=${JDBC_DATABASE_URL:${DATABASE_URL}}

# Creation automatique du schema relationnel a partir des annotations JPA
spring.jpa.hibernate.ddl-auto=create

# Mode d'initialisation SQL : toujours executer les scripts
spring.sql.init.mode=always

# Fichier de donnees initiales
spring.sql.init.data-locations=classpath:data.sql

# Initialiser les donnees APRES la creation du schema
spring.jpa.defer-datasource-initialization=true

# Configuration SendGrid pour l'envoi d'emails
spring.sendgrid.api-key=${SENDGRID_API_KEY}
sendgrid.from.email=${SENDGRID_FROM_EMAIL}
sendgrid.from.name=${SENDGRID_FROM_NAME}

# Configuration du serveur
server.port=${PORT:8080}

# Logging
logging.level.root=INFO
logging.level.pharmacie=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
