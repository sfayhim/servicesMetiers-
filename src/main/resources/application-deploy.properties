# Profil de deploiement pour production
# On suppose que la base de donnees est deja creee et initialisee sur le serveur PostgreSQL

# Pour demarrer avec ce profil localement :
# mvn spring-boot:run -Dspring-boot.run.profiles=deploy

# Pour generer du SQL optimise pour PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# L'URL de la source de donnees PostgreSQL
# Render fournit automatiquement JDBC_DATABASE_URL avec le bon format jdbc:postgresql://...
spring.datasource.url=${JDBC_DATABASE_URL:${DATABASE_URL}}

# Ne pas recreer le schema - la BD existe deja
spring.jpa.hibernate.ddl-auto=validate

# Ne pas executer les scripts d'initialisation
spring.sql.init.mode=never

# Configuration SendGrid pour l'envoi d'emails
spring.sendgrid.api-key=${SENDGRID_API_KEY}
sendgrid.from.email=${SENDGRID_FROM_EMAIL}
sendgrid.from.name=${SENDGRID_FROM_NAME}

# Configuration du serveur
server.port=${PORT:8080}

# Logging
logging.level.root=INFO
logging.level.pharmacie=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
