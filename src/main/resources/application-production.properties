# Configuration pour la production (PostgreSQL sur Render)

# DataSource PostgreSQL
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Port configuré par Render
server.port=${PORT:8080}

# Configuration SendGrid
sendgrid.api.key=${SENDGRID_API_KEY}
sendgrid.from.email=${SENDGRID_FROM_EMAIL}
sendgrid.from.name=${SENDGRID_FROM_NAME:Pharmacie}

# API REST
spring.data.rest.base-path=api

# Logs en production
logging.level.root=INFO
logging.level.pharmacie=INFO
server.error.include-stacktrace=never

# JSON formatting
spring.jackson.serialization.indent-output=false

# Swagger en production (optionnel, à désactiver pour plus de sécurité)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
